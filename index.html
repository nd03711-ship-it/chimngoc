<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Kim Ngọc</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #111 0%, #000 70%);
    font-family: Arial, sans-serif;
  }

  canvas {
    display: block;
  }

  .text {
    position: absolute;
    top: 32%;
    left: 50%;
    transform: translateX(-50%);
    color: #fff6a8;
    font-size: clamp(24px, 4vw, 64px);
    font-weight: 700;
    text-shadow: 0 0 10px #ff4d88, 0 0 20px #ff4d88, 0 0 30px #ff9bd3;
    letter-spacing: 1px;
    text-align: center;
    pointer-events: none;
    z-index: 2;
  }

  .cake {
    position: absolute;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    width: 240px;
    height: 180px;
    z-index: 2;
  }

  .plate {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 260px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(#d9d9d9, #a9a9a9);
    box-shadow: 0 0 20px rgba(255,255,255,.3);
  }

  .layer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 18px 18px 12px 12px;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.08);
  }

  .layer.bottom {
    bottom: 18px;
    width: 240px;
    height: 70px;
    background: linear-gradient(#ff9ac8, #ff6fae);
  }

  .layer.middle {
    bottom: 80px;
    width: 190px;
    height: 55px;
    background: linear-gradient(#ffd7e8, #ffb8d4);
  }

  .layer.top {
    bottom: 130px;
    width: 140px;
    height: 40px;
    background: linear-gradient(#fff5fb, #ffd7e8);
  }

  .icing {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 50%;
    filter: drop-shadow(0 0 4px rgba(255,255,255,.35));
  }

  .icing.i1 {
    bottom: 145px;
    width: 18px;
    height: 18px;
    box-shadow: -20px 5px 0 #fff, 20px 5px 0 #fff, -40px 10px 0 #fff, 40px 10px 0 #fff;
  }

  .icing.i2 {
    bottom: 95px;
    width: 16px;
    height: 16px;
    box-shadow: -28px 4px 0 #ffdff0, 28px 4px 0 #ffdff0;
  }

  .icing.i3 {
    bottom: 35px;
    width: 18px;
    height: 18px;
    box-shadow: -35px 4px 0 #ffeff7, 35px 4px 0 #ffeff7;
  }

  .candle {
    position: absolute;
    width: 12px;
    height: 48px;
    background: repeating-linear-gradient(45deg, #ffe7a8 0 8px, #ff7ab3 8px 16px);
    border-radius: 6px;
    top: 0;
    box-shadow: 0 0 8px rgba(255,255,255,.4);
  }

  .candle::before {
    content: '';
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 20px;
    background: radial-gradient(circle at 50% 35%, #fff8cc 0%, #ffd24d 35%, #ff7b00 70%, rgba(255,123,0,0) 72%);
    border-radius: 50%;
    animation: flicker .18s infinite alternate;
  }

  @keyframes flicker {
    from { transform: translateX(-50%) scale(1); opacity: .85; }
    to { transform: translateX(-50%) scale(1.08); opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="fireworks"></canvas>

<div class="text">Happy Birthday Kim Ngọc</div>

<div class="cake">
  <div class="candle" style="left:78px;"></div>
  <div class="candle" style="left:110px;"></div>
  <div class="candle" style="left:142px;"></div>

  <div class="layer top"></div>
  <div class="layer middle"></div>
  <div class="layer bottom"></div>

  <div class="icing i1"></div>
  <div class="icing i2"></div>
  <div class="icing i3"></div>
  <div class="plate"></div>
</div>

<script>
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
let w, h;

function resize() {
  w = canvas.width = innerWidth;
  h = canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();

const particles = [];

function spawnHeart(x, y) {
  const points = 260;
  for (let i = 0; i < points; i++) {
    const t = Math.random() * Math.PI * 2;
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

    const angle = Math.atan2(hy, hx);
    const speed = 1.2 + Math.random() * 2.4;

    particles.push({
      x: x + hx * 18,
      y: y - hy * 18,
      vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 0.8,
      vy: -Math.sin(angle) * speed - 0.5,
      alpha: 1,
      decay: 0.006 + Math.random() * 0.01,
      size: 1.3 + Math.random() * 1.8,
      color: ['#ff4d88', '#ff7ab3', '#ffd166', '#ffffff'][Math.floor(Math.random() * 4)]
    });
  }
}

function spawnBurst() {
  const x = w * (0.2 + Math.random() * 0.6);
  const y = h * (0.15 + Math.random() * 0.35);
  spawnHeart(x, y);
}

function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, w, h);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.01;
    p.alpha -= p.decay;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  requestAnimationFrame(draw);
}

setInterval(spawnBurst, 700);
draw();
</script>
</body>
  </html>
